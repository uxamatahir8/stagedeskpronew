# Local services for development. Start with `pnpm services:up`.
# Ports are shifted where XAMPP or other local tools commonly sit (MySQL on 3307).
name: stagedesk-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stagedesk
      MYSQL_USER: stagedesk
      MYSQL_PASSWORD: stagedesk
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  storage:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: stagedesk
      RUSTFS_SECRET_KEY: stagedesk-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Stripe API stand-in for tests and development without Stripe keys.
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    restart: unless-stopped
    ports:
      - "12111:12111"

volumes:
  mysql-data:
  redis-data:
  storage-data:
